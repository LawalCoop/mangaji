name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # Los modelos no están en la historia del repo (pesan y son derivados de pesos de
      # terceros): viven como assets del release `models`.
      - name: Modelos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download models --repo "$GITHUB_REPOSITORY" --pattern '*.onnx' --dir apps/reader/public/models

      # El tomo de ejemplo, un episodio de uso libre: tampoco va en la historia del repo.
      - name: Ejemplo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download samples --repo "$GITHUB_REPOSITORY" --pattern '*.cbz' --dir apps/reader/public/samples

      - name: Build
        env:
          # Con el dominio propio (mangaji.lawal.coop) la app vive en la raíz: sin ruta base.
          STATIC_EXPORT: "1"
          # El sitio de GoatCounter, como variable del repo: sin ella no se cuentan visitas.
          NEXT_PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/reader/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
